Title = "MyTwoYen"
Content = """
My two yen on life.

I'm Brian Waters, a forensic toxicologist, lecturer, former criminalist, North Carolina native, and longtime resident of Fukuoka, Japan.

Here you'll find my thoughts on science, life in Japan, baseball, Star Trek, technology, family, and the occasional adventure that comes from living between two cultures.
"""

